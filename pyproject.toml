[project]
name = "rag-pinecone-hibrido"
version = "0.1.0"
description = "Pre-entrega 4: sistema RAG escalable en Pinecone Serverless con recuperador híbrido (vector + BM25) y evaluación"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=7.3.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

# No es un paquete instalable: los módulos viven en la raíz y se importan desde ahí.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# langchain-community avisa que está en retirada; BM25Retriever todavía vive ahí.
filterwarnings = ["ignore:`langchain-community` is being sunset:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
